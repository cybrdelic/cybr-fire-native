name: Portability
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --no-compile -r requirements.txt
      - run: python checkpoint_guard/test_checkpoint_guard.py
      - run: python tests/test_portable.py
      - run: python tests/test_native_quality_guard.py
      - run: python tests/test_camera_native_quality.py
      - run: python -m cybrfire.doctor --no-probe
  mesa-compute:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Wait for hosted Linux Docker service
        shell: bash
        timeout-minutes: 3
        run: |
          sudo systemctl start docker
          for attempt in 1 2 3; do
            if timeout 30s docker info --format '{{.OSType}}' | grep -qx linux; then
              exit 0
            fi
            echo "Docker is not ready (attempt ${attempt}/3)"
            sleep 5
          done
          sudo journalctl -u docker --no-pager -n 60
          exit 1
      - run: python tools/run_portable.py --build --image cybr-fire-portable
      - run: docker run --rm --entrypoint python cybr-fire-portable tests/test_portable_compute.py
      - run: docker run --rm --entrypoint python cybr-fire-portable tests/test_runtime.py
      - run: docker run --rm --entrypoint python cybr-fire-portable tests/test_detail.py
      - run: python tools/run_portable.py --image cybr-fire-portable --output ./portable-output -- tools/portable_smoke.py --out /output
      - uses: actions/upload-artifact@v4
        with:
          name: linux-mesa-smoke
          path: portable-output/
